[pytest]
# Pytest configuration for Legal Advocate AI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 8.0

# Test paths
testpaths = tests

# Add current directory to Python path
pythonpath = .

# Coverage configuration
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=extractors
    --cov=integrations
    --cov=models
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# Test markers
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests requiring multiple components
    e2e: End-to-end tests simulating real workflows
    slow: Tests that take more than 1 second
    gmail: Tests requiring Gmail API (can be mocked or real)
    mycase: Tests requiring MyCase API
    pdf: Tests requiring PDF processing
    database: Tests requiring database operations
    ai: Tests requiring AI/LLM functionality

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning:spacy.*
    ignore::DeprecationWarning:weasel.*
    ignore::DeprecationWarning:click.*
    ignore::DeprecationWarning:.*datetime.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20

# Output options
console_output_style = progress
log_cli = false
log_cli_level = INFO

# Parallel execution (install pytest-xdist to use)
# addopts = -n auto

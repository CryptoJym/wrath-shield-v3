# HYRO Memory Layer - Docker Compose
#
# This sets up the complete local memory infrastructure:
# - Qdrant: Vector database for Mem0 semantic search
# - Neo4j: Graph database for Graphiti temporal knowledge graphs (optional)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose up -d qdrant   # Start only Qdrant
#   docker-compose down           # Stop all services
#   docker-compose logs -f        # View logs

version: '3.8'

services:
  # ==========================================================================
  # QDRANT - Vector Database for Mem0
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hyro-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./config/qdrant:/qdrant/config:ro
    environment:
      - QDRANT__LOG_LEVEL=INFO
      # Uncomment to enable API key authentication:
      # - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # NEO4J - Graph Database for Graphiti (Optional)
  # ==========================================================================
  # Uncomment this section if you want to use Graphiti for temporal knowledge graphs
  #
  # neo4j:
  #   image: neo4j:5-community
  #   container_name: hyro-neo4j
  #   restart: unless-stopped
  #   ports:
  #     - "7474:7474"  # HTTP
  #     - "7687:7687"  # Bolt
  #   volumes:
  #     - neo4j_data:/data
  #     - neo4j_logs:/logs
  #   environment:
  #     - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-hyro_memory_2024}
  #     - NEO4J_PLUGINS=["apoc"]
  #     - NEO4J_dbms_memory_heap_initial__size=512m
  #     - NEO4J_dbms_memory_heap_max__size=1G
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:7474"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s

  # ==========================================================================
  # MEMORY SERVICE - Python FastAPI (Optional containerized version)
  # ==========================================================================
  # Uncomment to run the memory service in Docker instead of locally
  #
  # memory-service:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: hyro-memory-service
  #   restart: unless-stopped
  #   ports:
  #     - "8789:8789"
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - QDRANT_HOST=qdrant
  #     - QDRANT_PORT=6333
  #     - NEO4J_URL=bolt://neo4j:7687
  #     - NEO4J_USERNAME=neo4j
  #     - NEO4J_PASSWORD=${NEO4J_PASSWORD:-hyro_memory_2024}
  #   depends_on:
  #     qdrant:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8789/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

volumes:
  qdrant_storage:
    driver: local
  # neo4j_data:
  #   driver: local
  # neo4j_logs:
  #   driver: local

networks:
  default:
    name: hyro-memory-network

name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        exclude:
          # Reduce matrix size - test all Python versions on Ubuntu only
          - os: macos-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.12'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils  # For PDF processing

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install poppler  # For PDF processing

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-xdist  # For parallel test execution

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests
      run: |
        pytest tests/ -v -m "unit and not slow" --junitxml=junit/test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml

    - name: Run integration tests
      run: |
        pytest tests/ -v -m "integration and not slow" --junitxml=junit/integration-results-${{ matrix.os }}-${{ matrix.python-version }}.xml

    - name: Run slow tests
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        pytest tests/ -v -m "slow" --junitxml=junit/slow-results-${{ matrix.os }}-${{ matrix.python-version }}.xml

    - name: Generate coverage report
      run: |
        pytest tests/ --cov=extractors --cov=integrations --cov=models \
          --cov-report=xml:coverage-${{ matrix.os }}-${{ matrix.python-version }}.xml \
          --cov-report=html:htmlcov-${{ matrix.os }}-${{ matrix.python-version }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage-${{ matrix.os }}-${{ matrix.python-version }}.xml
        flags: ${{ matrix.os }}-py${{ matrix.python-version }}
        name: ${{ matrix.os }}-${{ matrix.python-version }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: junit/

    - name: Upload coverage HTML
      if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: htmlcov-${{ matrix.os }}-${{ matrix.python-version }}/

  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install mypy types-requests

    - name: Type check with mypy
      continue-on-error: true
      run: |
        mypy extractors/ integrations/ models/ --ignore-missing-imports

  security-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Security scan with bandit
      run: |
        bandit -r extractors/ integrations/ models/ -f json -o bandit-report.json || true

    - name: Check dependencies with safety
      continue-on-error: true
      run: |
        safety check --json

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json

  coverage-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run coverage check
      run: |
        pytest tests/ --cov=extractors --cov=integrations --cov=models \
          --cov-fail-under=80 \
          --cov-report=term-missing

    - name: Coverage threshold check
      run: |
        echo "Coverage threshold: 80%"
        echo "If this step fails, coverage is below 80%"
